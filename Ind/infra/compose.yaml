name: it-school
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: it_school
      POSTGRES_USER: it_school
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
    command: ["postgres", "-c", "shared_buffers=48MB", "-c", "max_connections=20", "-c", "work_mem=2MB"]
    volumes: ["database:/var/lib/postgresql/data"]
    networks: [private]
    mem_limit: 256m
    pids_limit: 120
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U it_school -d it_school"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
  api:
    image: it-school-api:${RELEASE_ID:-local}
    build:
      context: .
      dockerfile: infra/Dockerfile
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=160
      PORT: 3100
      DB_HOST: db
      DB_USER: it_school
      DB_NAME: it_school
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:?Admin initial password required}
      PUBLIC_URL: ${PUBLIC_URL:-https://telegrambot.vps.webdock.cloud/it-school/}
      COOKIE_SECURE: "true"
    ports: ["127.0.0.1:3100:3100"]
    networks: [private, edge]
    mem_limit: 256m
    pids_limit: 80
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
networks:
  edge: {}
  private:
    internal: true
volumes:
  database:
